[project]
name = "quantanything"
version = "0.2.0"
description = "Post-training quantization of ONNX models with NumPy and C++ kernels"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "pillow>=10",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Only needed to export the demo YOLOv8-cls model to ONNX.
export = ["ultralytics>=8.3"]
notebook = ["jupyter"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["quantization/tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["quantization"]
include-package-data = true

[tool.setuptools.package-data]
quantization = ["kernels/*.cpp"]
